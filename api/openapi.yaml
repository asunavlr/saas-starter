openapi: 3.1.0
info:
  title: SaaS Starter API
  version: 0.1.0
  description: Multi-tenant SaaS foundation API.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      summary: Liveness probe
      responses:
        '200': { description: API is alive }
  /readyz:
    get:
      summary: Readiness probe
      responses:
        '200': { description: Database is reachable }
  /v1/auth/register:
    post:
      summary: Register a user and create an owner workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, maxLength: 120 }
                email: { type: string, format: email }
                password: { type: string, minLength: 10 }
      responses:
        '201': { description: Account and workspace created }
        '409': { description: Email already registered }
  /v1/auth/login:
    post:
      summary: Authenticate and list workspaces
      responses:
        '200': { description: Access token issued }
        '401': { description: Invalid credentials }
  /v1/projects:
    get:
      summary: List projects in the selected tenant
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: X-Organization-ID
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Tenant projects }
    post:
      summary: Create a project (owner/admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: X-Organization-ID
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201': { description: Project created }
  /v1/projects/{id}:
    delete:
      summary: Delete a project (owner/admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-Organization-ID
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Project deleted }

  /v1/me:
    get:
      summary: Return the authenticated user profile
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Current user profile }
  /v1/audit-events:
    get:
      summary: List recent audit events for the selected tenant (owner/admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: X-Organization-ID
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Tenant audit events }
        '403': { description: Insufficient role }
  /v1/billing:
    get:
      summary: Read subscription status and plan entitlements
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: X-Organization-ID
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Current plan, subscription status and quotas }
        '404': { description: Subscription not found }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
