name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: saas
          POSTGRES_PASSWORD: saas
          POSTGRES_DB: saas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U saas -d saas_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - run: go mod tidy
      - run: go test ./...
        env:
          DATABASE_URL: postgres://saas:saas@localhost:5432/saas_test?sslmode=disable
          JWT_SECRET: ci-test-secret-that-is-long-enough-for-tests
      - run: go vet ./...
